services:

  # ---- Bancos de dados (um MongoDB por servico, conforme o conteudo 4.1) ----
  catalogo-mongo:
    image: mongo:8
    container_name: catalogo-mongo
    ports:
      - "27017:27017"
    volumes:
      - catalogo_mongo_data:/data/db

  cliente-mongo:
    image: mongo:8
    container_name: cliente-mongo
    ports:
      - "27018:27017"
    volumes:
      - cliente_mongo_data:/data/db

  pedido-mongo:
    image: mongo:8
    container_name: pedido-mongo
    ports:
      - "27019:27017"
    volumes:
      - pedido_mongo_data:/data/db

  # ---- Microsservicos ----
  catalogo-service:
    build: ./catalogo-service
    container_name: catalogo-service
    environment:
      MONGODB_URI: mongodb://catalogo-mongo:27017/catalogo
    ports:
      - "8081:8081"
    depends_on:
      - catalogo-mongo

  cliente-service:
    build: ./cliente-service
    container_name: cliente-service
    environment:
      MONGODB_URI: mongodb://cliente-mongo:27017/cliente
    ports:
      - "8082:8082"
    depends_on:
      - cliente-mongo

  pedido-service:
    build: ./pedido-service
    container_name: pedido-service
    environment:
      MONGODB_URI: mongodb://pedido-mongo:27017/pedido
      CATALOGO_SERVICE_URL: http://catalogo-service:8081
      CLIENTE_SERVICE_URL: http://cliente-service:8082
    ports:
      - "8083:8083"
    depends_on:
      - pedido-mongo
      - catalogo-service
      - cliente-service

  # ---- Porta unica de entrada ----
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      CATALOGO_SERVICE_URL: http://catalogo-service:8081
      CLIENTE_SERVICE_URL: http://cliente-service:8082
      PEDIDO_SERVICE_URL: http://pedido-service:8083
    ports:
      - "8080:8080"
    depends_on:
      - catalogo-service
      - cliente-service
      - pedido-service

volumes:
  catalogo_mongo_data:
  cliente_mongo_data:
  pedido_mongo_data:
