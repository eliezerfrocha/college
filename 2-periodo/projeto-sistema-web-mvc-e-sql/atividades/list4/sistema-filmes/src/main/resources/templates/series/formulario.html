<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulário de Série</title>
    <!-- Materialize CSS -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        /* Centralização total */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5; /* Cor de fundo suave */
        }

        .card {
            width: 100%;
            max-width: 600px; /* Largura máxima do card */
            padding: 30px;
        }

        .card-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-field label {
            font-size: 1.2rem;
        }

        .btn {
            margin-top: 30px;
            width: 100%; /* Botão ocupa toda a largura */
        }

        .card-action {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Card centralizado -->
    <div class="card z-depth-3">
        <div class="card-content">
            <span class="card-title" th:text="${#strings.isEmpty(serie.id) ? 'Nova Série' : 'Editar Série'}"></span>
            
            <form th:action="@{/series/salvar}" th:object="${serie}" method="post">
                <input type="hidden" th:field="*{id}" />

                <!-- Campo Título -->
                <div class="input-field">
                    <input 
                      type="text" 
                      id="titulo" 
                      th:field="*{titulo}" 
                      placeholder="Digite o título da série" 
                      class="validate" 
                    />
                    <label for="titulo">Título</label>
                </div>

                <!-- Campo Temporadas -->
                <div class="input-field">
                    <input 
                      type="number" 
                      id="temporadas" 
                      th:field="*{temporadas}" 
                      placeholder="Número total de temporadas" 
                      class="validate" 
                    />
                    <label for="temporadas">Temporadas</label>
                </div>

                <!-- Campo Episódios -->
                <div class="input-field">
                    <input 
                      type="number" 
                      id="episodios" 
                      th:field="*{episodios}" 
                      placeholder="Número total de episódios" 
                      class="validate" 
                    />
                    <label for="episodios">Episódios</label>
                </div>

                <!-- Campo Ano de Estreia -->
                <div class="input-field">
                    <input 
                      type="number" 
                      id="anoEstreia" 
                      th:field="*{anoEstreia}" 
                      placeholder="Ano em que a série estreou" 
                      class="validate" 
                    />
                    <label for="anoEstreia">Ano de Estreia</label>
                </div>

                <!-- Botão Salvar -->
                <button type="submit" class="waves-effect waves-light btn blue">Salvar</button>
            </form>
        </div>

        <div class="card-action center-align">
            <a class="waves-effect waves-light btn grey lighten-1" th:href="@{/filmes}">Voltar</a>
        </div>
    </div>

    <!-- Materialize JS -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"
    ></script>
</body>
</html>
