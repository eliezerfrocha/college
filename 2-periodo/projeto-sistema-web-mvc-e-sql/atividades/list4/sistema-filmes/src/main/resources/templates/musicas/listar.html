<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Músicas</title>
    <!-- Materialize CSS -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5; /* Fundo suave */
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .card {
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        table {
            margin-top: 20px;
        }

        .btn {
            margin-right: 10px;
        }

        .actions a {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card z-depth-3">
            <h1>Músicas</h1>
            <div class="row">
                <!-- Botão para adicionar nova música -->
                <a 
                  th:href="@{/musicas/nova}" 
                  class="btn waves-effect waves-light blue"
                >
                    Adicionar Nova Música
                </a>
                <a 
                  th:href="@{/}" 
                  class="btn waves-effect waves-light grey lighten-1"
                >
                    Voltar à Página Inicial
                </a>
            </div>

            <!-- Tabela de músicas -->
            <table class="highlight centered responsive-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Artista</th>
                        <th>Álbum</th>
                        <th>Duração (segundos)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="musica : ${musicas}">
                        <td th:text="${musica.id}"></td>
                        <td th:text="${musica.titulo}"></td>
                        <td th:text="${musica.artista}"></td>
                        <td th:text="${musica.album}"></td>
                        <td th:text="${musica.duracao}"></td>
                        <td class="actions">
                            <!-- Botão de edição -->
                            <a 
                              th:href="@{/musicas/editar/{id}(id=${musica.id})}" 
                              class="btn-small waves-effect waves-light orange"
                            >
                                Editar
                            </a>
                            <!-- Botão de exclusão -->
                            <a 
                              th:href="@{/musicas/excluir/{id}(id=${musica.id})}" 
                              class="btn-small waves-effect waves-light red"
                            >
                                Excluir
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Materialize JS -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"
    ></script>
</body>
</html>
