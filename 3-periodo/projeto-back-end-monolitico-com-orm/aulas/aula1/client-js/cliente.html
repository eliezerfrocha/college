<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consumir Clientes</title>
</head>
<body>
  <h1>Lista de Clientes</h1>
  <button id="btn-carregar">Carregar Clientes</button>
  <ul id="lista-clientes"></ul>
  <p id="erro-msg" style="color: red; display: none;"></p>

  <script>
    async function carregarClientes() {
      const lista = document.getElementById('lista-clientes');
      const erroMsg = document.getElementById('erro-msg');
      erroMsg.style.display = 'none';
      lista.innerHTML = '<li>Carregando...</li>';

      try {
        const resposta = await fetch('http://localhost:8080/api/cliente');
        if (!resposta.ok) {
          throw new Error(`Erro ao buscar clientes: ${resposta.status}`);
        }

        const clientes = await resposta.json();
        lista.innerHTML = '';

        if (clientes.length === 0) {
          lista.innerHTML = '<li>Nenhum cliente encontrado.</li>';
          return;
        }

        clientes.forEach(cliente => {
          const item = document.createElement('li');
          item.textContent = `Código: ${cliente.codigo} - Nome: ${cliente.nome}`;
          lista.appendChild(item);
        });

      } catch (erro) {
        lista.innerHTML = '';
        erroMsg.textContent = 'Erro ao carregar clientes. Tente novamente.';
        erroMsg.style.display = 'block';
        console.error('Erro:', erro);
      }
    }

    document.getElementById('btn-carregar').addEventListener('click', carregarClientes);
  </script>
</body>
</html>
